services:
  - type: web
    name: omnix
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OMNIX_DATABASE_URL
        sync: false
      - key: OMNIX_S3_BUCKET
        value: omnix
      - key: OMNIX_S3_ENDPOINT
        sync: false
      - key: OMNIX_S3_REGION
        sync: false
      - key: OMNIX_S3_ACCESS_KEY_ID
        sync: false
      - key: OMNIX_S3_SECRET_ACCESS_KEY
        sync: false
